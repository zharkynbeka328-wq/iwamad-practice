<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal profile card of Akmaral Zharkynbek">
    <title>Akmaral Zharkynbek - Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        main {
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: white;

            /* Padding: space inside the card */
            padding: 25px;

            /* Border: line around the card */
            border: 1px solid #ddd;

            /* Margin: space outside the card */
            margin: 20px;

            border-radius: 12px;
            max-width: 600px;
            width: 100%;
        }

        .profile-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-content img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        .links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .links a {
            text-decoration: none;
        }

        #likeButton {
            margin-top: 20px;
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .profile-content {
                flex-direction: column;
                text-align: center;
            }

            .links {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Profile</h1>
        <p>IT Management Student and Aspiring Web Developer</p>
    </header>

    <main>
        <section class="card">

            <div class="profile-content">
                <img
                    src="photo.jpg"
                    alt="Photo of Akmaral Zharkynbek"
                >

                <div>
                    <h2>Akmaral Zharkynbek</h2>

                    <p>
                        I am an IT Management student interested in
                        technology and web development. I am improving
                        my HTML, CSS, and JavaScript skills.
                    </p>
                </div>
            </div>

            <div class="links">
                <a href="mailto:zharkynbeka328@gmail.com">Email</a>
                <a href="https://github.com/zharkynbeka328-wq" target="_blank">
                    GitHub
                </a>
            </div>

            <button id="likeButton" type="button">♡ Like</button>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Akmaral Zharkynbek</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
